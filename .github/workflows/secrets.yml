name: Secret scan

permissions:
  contents: read
  id-token: write

on:
  pull_request:
  push:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # WHY: gitleaks scans history, not just the diff. Default checkout
          # depth is 1, which would only ever see the latest commit.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}