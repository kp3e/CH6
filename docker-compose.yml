services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: split
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: split
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # WHY: compose reports "started" as soon as the process launches, which is
      # before Postgres accepts connections. Without this, `docker compose up`
      # followed immediately by a migration fails on a race you'll blame on Prisma.
      test: ["CMD-SHELL", "pg_isready -U split -d split"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data: